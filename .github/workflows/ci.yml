name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out Reasoning
        uses: actions/checkout@v7

      - name: Check out verified Foundation baseline
        uses: actions/checkout@v7
        with:
          repository: CyberSecGPT/cybersecgpt-foundation
          ref: 6f892bb7a4bddd07cfd7acdae7a925971006208d
          path: .deps/cybersecgpt-foundation

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .deps/cybersecgpt-foundation
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Check formatting
        run: python -m black --check --diff .

      - name: Run mypy
        run: python -m mypy src scripts

      - name: Validate repository security and dependency boundaries
        run: python scripts/validate_repository.py

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run tests with coverage
        run: >-
          python -m pytest
          --cov=cybersecgpt.reasoning
          --cov-report=term-missing
          --cov-fail-under=100

  build:
    name: Build distributions
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out Reasoning
        uses: actions/checkout@v7

      - name: Check out verified Foundation baseline
        uses: actions/checkout@v7
        with:
          repository: CyberSecGPT/cybersecgpt-foundation
          ref: 6f892bb7a4bddd07cfd7acdae7a925971006208d
          path: .deps/cybersecgpt-foundation

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .deps/cybersecgpt-foundation
          python -m pip install -e ".[dev]"

      - name: Build distributions
        run: python -m build

      - name: Verify distribution boundaries
        run: python scripts/verify_distribution.py dist
